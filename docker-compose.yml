services:
  db:
    image: mariadb:10.11
    container_name: resplandor_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password1234
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: password1234
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -ppassword1234 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    container_name: resplandor_wordpress
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: password1234
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEFAULT_THEME', 'resplandor-floral' );
    volumes:
      - wp_data:/var/www/html
      - ./resplandor-floral:/var/www/html/wp-content/themes/resplandor-floral

volumes:
  db_data:
  wp_data:
